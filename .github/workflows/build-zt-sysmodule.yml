name: Build ZeroTier Sysmodule B1

on:
  push:
    branches: [main]
    paths:
      - 'zt_sysmodule/**'
      - 'libzt'
      - 'cmake/switch.toolchain.cmake'
      - 'ldn_mitm'
      - 'scripts/errno_compat.c'
      - '.github/workflows/build-zt-sysmodule.yml'
  pull_request:
    paths:
      - 'zt_sysmodule/**'
      - 'libzt'
      - 'cmake/switch.toolchain.cmake'
      - 'ldn_mitm'
      - 'scripts/errno_compat.c'
      - '.github/workflows/build-zt-sysmodule.yml'
  workflow_dispatch:

jobs:
  build-zt-sysmodule-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark checked-out repositories safe
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ldn_mitm"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/libzt"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ldn_mitm/Atmosphere-libs"

      - name: Fetch and checkout pinned sources
        run: |
          set -eu
          git -C ldn_mitm fetch --no-tags origin 2fe07817eeea06b712009395f8bbcb2a02d30979
          git -C ldn_mitm checkout --detach 2fe07817eeea06b712009395f8bbcb2a02d30979
          git -C libzt fetch --no-tags origin 76c138bb916bc3a20d356bd4ef8e2195212ddb1e
          git -C libzt checkout --detach 76c138bb916bc3a20d356bd4ef8e2195212ddb1e

      - name: Verify pins
        run: |
          set -eu
          LDN_SHA="$(git -C ldn_mitm rev-parse HEAD)"
          LIBZT_SHA="$(git -C libzt rev-parse HEAD)"
          echo "ldn_mitm SHA: $LDN_SHA"
          echo "libzt SHA:     $LIBZT_SHA"
          test "$LDN_SHA" = "2fe07817eeea06b712009395f8bbcb2a02d30979"
          test "$LIBZT_SHA" = "76c138bb916bc3a20d356bd4ef8e2195212ddb1e"

          ATMOSPHERE_PIN="d3083af1827cd6ca2a96feb9316eb85cd01bae1f"
          test -f ldn_mitm/Atmosphere-libs/.gitrepo
          ATMOSPHERE_SHA="$(sed -n 's/^[[:space:]]*commit = //p' ldn_mitm/Atmosphere-libs/.gitrepo)"
          echo "Atmosphere-libs .gitrepo SHA: $ATMOSPHERE_SHA"
          test "$ATMOSPHERE_SHA" = "$ATMOSPHERE_PIN"
          test -f ldn_mitm/Atmosphere-libs/config/templates/stratosphere.mk
          test -f ldn_mitm/Atmosphere-libs/libstratosphere/Makefile
          test -f zt_sysmodule/Makefile
          grep -q 'ATMOSPHERE_LIBRARIES_DIR' zt_sysmodule/Makefile
          grep -q 'include .*ATMOSPHERE_LIBRARIES_DIR.*config/templates/stratosphere.mk' zt_sysmodule/Makefile
          ! grep -q 'zt_sysmodule/ldn_mitm/Atmosphere-libs' zt_sysmodule/Makefile

      - name: Restore Atmosphere libstratosphere cache
        id: atmosphere-cache
        uses: actions/cache/restore@v4
        with:
          key: atmosphere-libstratosphere-d3083af-devkita64
          path: ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Build Atmosphere libstratosphere
        if: steps.atmosphere-cache.outputs.cache-hit != 'true'
        working-directory: ldn_mitm/Atmosphere-libs
        run: |
          set -eu
          make -C libstratosphere nx_release
          test -s libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Verify Atmosphere libstratosphere
        run: |
          set -eu
          test -s ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Save Atmosphere libstratosphere cache
        if: steps.atmosphere-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: atmosphere-libstratosphere-d3083af-devkita64
          path: ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Build Sys B B1 skeleton (ZERO libzt)
        working-directory: zt_sysmodule
        run: |
          set -eu
          test -f source/main.cpp
          grep -q 'ZT_SYS_B1' Makefile
          ! grep -q -- '-lzt' Makefile
          ! grep -q -- 'LIBDIRS.*libzt' Makefile
          ! grep -q 'zt_compat.cpp' Makefile
          ! grep -q 'errno_compat.c' Makefile
          make clean || true
          make -j2
          test -s zerotier_sys.nsp

      - name: Package Sys B skeleton
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/atmosphere/contents/4200000000000011/flags
          cp zt_sysmodule/zerotier_sys.nsp dist/atmosphere/contents/4200000000000011/exefs.nsp
          cp zt_sysmodule/res/toolbox.json dist/atmosphere/contents/4200000000000011/toolbox.json
          touch dist/atmosphere/contents/4200000000000011/flags/boot2.flag
          test -s dist/atmosphere/contents/4200000000000011/exefs.nsp
          test -s dist/atmosphere/contents/4200000000000011/toolbox.json
          test -f dist/atmosphere/contents/4200000000000011/flags/boot2.flag
          cd dist
          zip -r ../zerotier-sysmodule-b1-skeleton.zip atmosphere

      - name: Upload Sys B skeleton artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-sysmodule-b1-skeleton
          path: zerotier-sysmodule-b1-skeleton.zip
          retention-days: 14
