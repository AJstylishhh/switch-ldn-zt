name: Build libzt for Nintendo Switch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-libzt-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitA64
        run: |
          set -eu
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
          aarch64-none-elf-gcc --version
          aarch64-none-elf-g++ --version
          test "$(aarch64-none-elf-gcc -dumpmachine)" = "aarch64-none-elf"

      - name: Clone upstream libzt
        run: |
          set -eu
          git clone --depth 1 --recurse-submodules https://github.com/zerotier/libzt.git
          cd libzt
          echo "libzt commit: $(git rev-parse HEAD)"
          echo "ZeroTierOne commit: $(git -C ext/ZeroTierOne rev-parse HEAD)"
          echo "lwIP commit: $(git -C ext/lwip rev-parse HEAD)"

      - name: Prepare Switch compatibility headers
        working-directory: libzt
        run: |
          set -eu
          mkdir -p ext/arpa
          cat > ext/endian.h <<'EOF'
          #pragma once
          #define __LITTLE_ENDIAN 1234
          #define __BIG_ENDIAN 4321
          #define __BYTE_ORDER __LITTLE_ENDIAN
          EOF
          cat > ext/arpa/inet.h <<'EOF'
          #pragma once
          #include <sys/socket.h>
          #include <netinet/in.h>
          EOF

      - name: Patch Switch platform differences
        working-directory: libzt
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Constants.hpp: Switch must use ZeroTier's UNIX-like code paths.
          p = Path('ext/ZeroTierOne/node/Constants.hpp')
          s = p.read_text()
          block = '#ifdef __SWITCH__\n#ifndef __UNIX_LIKE__\n#define __UNIX_LIKE__\n#endif\n#endif\n\n'
          if block not in s:
              marker = '#ifdef __APPLE__\n'
              if marker not in s:
                  raise SystemExit('Constants.hpp insertion marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)

          # Utils.hpp: Switch has strtok(), but not POSIX strtok_r().
          # Use a regex so harmless upstream whitespace/indentation changes do not break CI.
          p = Path('ext/ZeroTierOne/node/Utils.hpp')
          s = p.read_text()
          pattern = re.compile(
              r'(static\s+inline\s+char\s*\*\s*stok\s*\(\s*char\s*\*\s*str\s*,\s*const\s+char\s*\*\s*delim\s*,\s*char\s*\*\s*\*\s*saveptr\s*\)\s*\{).*?(^\s*\}\s*)',
              re.MULTILINE | re.DOTALL,
          )
          new = r'''\1
#ifdef __WINDOWS__
		return strtok_s(str, delim, saveptr);
#elif defined(__SWITCH__)
		(void)saveptr;
		return strtok(str, delim);
#else
		return strtok_r(str, delim, saveptr);
#endif
\2'''
          s2, n = pattern.subn(new, s, count=1)
          if n != 1:
              raise SystemExit('Utils.hpp stok function not found')
          p.write_text(s2)

          # Binder.hpp: hide Linux-only interface enumeration headers and use wildcard sockets on Switch.
          p = Path('ext/ZeroTierOne/osdep/Binder.hpp')
          s = p.read_text()
          s = s.replace('#include <ifaddrs.h>', '#ifndef __SWITCH__\n#include <ifaddrs.h>\n#endif', 1)
          marker = 'bool interfacesEnumerated = true;'
          switch_block = marker + '\n#ifdef __SWITCH__\n\t\tinterfacesEnumerated = false;\n#endif'
          if marker in s and '#ifdef __SWITCH__\n\t\tinterfacesEnumerated = false;' not in s:
              s = s.replace(marker, switch_block, 1)
          p.write_text(s)

          # Phy.hpp: sys/un.h is unavailable on Switch and isn't needed for the UDP path.
          p = Path('ext/ZeroTierOne/osdep/Phy.hpp')
          s = p.read_text()
          s = s.replace('#include <sys/un.h>', '#ifndef __SWITCH__\n#include <sys/un.h>\n#endif', 1)
          p.write_text(s)
          PY

      - name: Patch libzt CMake for Switch
        working-directory: libzt
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          s = p.read_text()

          s = s.replace('${ZTO_SRC_DIR}/osdep/PortMapper.cpp', '', 1)
          s = s.replace('$<TARGET_OBJECTS:natpmp_pic> $<TARGET_OBJECTS:miniupnpc_pic>', '', 1)
          s = s.replace(
              'set(ZT_FLAGS "${ZT_FLAGS} -DZT_USE_MINIUPNPC=1")',
              'if(NOT SWITCH)\n    set(ZT_FLAGS "${ZT_FLAGS} -DZT_USE_MINIUPNPC=1")\nendif()',
              1,
          )
          p.write_text(s)
          PY

      - name: Configure libzt
        working-directory: libzt
        run: |
          set -eu
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          cmake -S . -B build-switch \
            -DCMAKE_TOOLCHAIN_FILE=/__w/switch-ldn-zt/switch-ldn-zt/cmake/switch.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC_LIB=ON \
            -DBUILD_SHARED_LIB=OFF \
            -DBUILD_HOST_EXAMPLES=OFF \
            -DBUILD_HOST_SELFTEST=OFF \
            -DALLOW_INSTALL_TARGET=OFF \
            -DZTS_DISABLE_CENTRAL_API=ON \
            -DSWITCH=ON \
            -DCMAKE_C_FLAGS="-D__SWITCH__ -DSWITCH -I/__w/switch-ldn-zt/switch-ldn-zt/libzt/ext" \
            -DCMAKE_CXX_FLAGS="-D__SWITCH__ -DSWITCH -I/__w/switch-ldn-zt/switch-ldn-zt/libzt/ext"

      - name: Verify Switch flags
        working-directory: libzt
        run: |
          set -eu
          grep -R -- "-D__SWITCH__" build-switch/CMakeFiles | head -20

      - name: Build libzt static library
        working-directory: libzt
        run: |
          set -eu
          cmake --build build-switch --target zt-static --parallel 2 --verbose

      - name: Verify artifact
        working-directory: libzt
        run: |
          set -eu
          LIB="$(find build-switch -type f -name 'libzt.a' | head -1)"
          test -n "$LIB"
          test -s "$LIB"
          echo "Switch library: $LIB"
          aarch64-none-elf-ar t "$LIB" | head -60

      - name: Package Switch libzt
        run: |
          set -eu
          mkdir -p dist/libzt-switch/include dist/libzt-switch/lib
          cp libzt/include/ZeroTierSockets.h dist/libzt-switch/include/
          cp "$(find libzt/build-switch -type f -name 'libzt.a' | head -1)" dist/libzt-switch/lib/
          cp cmake/switch.toolchain.cmake dist/libzt-switch/
          tar -C dist -czf libzt-switch.tar.gz libzt-switch

      - name: Upload Switch libzt artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzt-switch
          path: libzt-switch.tar.gz
          retention-days: 14
