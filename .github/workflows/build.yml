name: Build attempt

# Same pattern as your NRO CI pipelines — trigger from phone via a normal push/PR,
# GitHub's runner does the actual compiling so you never need a PC/laptop for this either.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-libzt-core:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug files
        run: |
          pwd
          ls -la
          find . -name "switch.toolchain.cmake"
      - name: Clone libzt
        run: git clone --recurse-submodules https://github.com/zerotier/libzt.git

      - name: Patch endian.h for Switch
        run: |
          sed -i 's|#include <endian.h>|// patched for Switch|g' libzt/ext/ZeroTierOne/node/Constants.hpp
      - name: Configure libztcore (zto_obj) with devkitA64 toolchain
        # First real attempt: just the ZeroTier core protocol/crypto object library,
        # which doesn't need the lwIP socket layer yet. Expected to surface real
        # missing-header/symbol errors — that's useful signal, not a failure of the pipeline.
        working-directory: libzt
        run: |
          mkdir -p build-switch
          cd build-switch
          cmake -DCMAKE_TOOLCHAIN_FILE=/__w/switch-ldn-zt/switch-ldn-zt/cmake/switch.toolchain.cmake \
                -DBUILD_STATIC_LIB=ON \
                -DBUILD_SHARED_LIB=OFF \
                -DBUILD_HOST_SELFTEST=OFF \
                -DALLOW_INSTALL_TARGET=OFF \
                -DZTS_DISABLE_CENTRAL_API=ON \
                ..
        continue-on-error: true

      - name: Attempt to build just the zto_obj target
        working-directory: libzt/build-switch
        run: cmake --build . --target zto_obj --verbose
        continue-on-error: true

      - name: Build ldn_mitm base (sanity check toolchain works at all)
        run: |
          git clone https://github.com/spacemeowx2/ldn_mitm.git
          echo "TODO: needs libstratosphere submodule + Atmosphere headers to actually build — placeholder for now"
        continue-on-error: true
