name: Build LDN-ZT stubs-first control

on:
  push:
    branches: [main]
    paths:
      - 'ldn_mitm/**'
      - 'scripts/anchor_check_defender.py'
      - 'scripts/patch-ldn-zt.py'
      - 'scripts/zt_bridge.hpp'
      - 'scripts/zt_stubs.cpp'
      - '.gitmodules'
      - '.github/workflows/build-ldn.yml'
  pull_request:
    paths:
      - 'ldn_mitm/**'
      - 'scripts/anchor_check_defender.py'
      - 'scripts/patch-ldn-zt.py'
      - 'scripts/zt_bridge.hpp'
      - 'scripts/zt_stubs.cpp'
      - '.gitmodules'
      - '.github/workflows/build-ldn.yml'
  workflow_dispatch:

jobs:
  build-ldn-zt-stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout exact Defender base
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Defender and Atmosphere-libs pins
        run: |
          set -eu
          actual="$(git -C ldn_mitm rev-parse HEAD)"
          echo "ldn_mitm: $actual"
          test "$actual" = "2fe07817eeea06b712009395f8bbcb2a02d30979"

          atmosphere_commit="$(sed -n 's/^[[:space:]]*commit = //p' ldn_mitm/Atmosphere-libs/.gitrepo)"
          echo "Atmosphere-libs: $atmosphere_commit"
          test "$atmosphere_commit" = "d3083af1827cd6ca2a96feb9316eb85cd01bae1f"

      - name: Verify Defender v1.21.2 patch anchors
        run: python3 scripts/anchor_check_defender.py

      - name: Force clean Atmosphere library rebuild
        working-directory: ldn_mitm/Atmosphere-libs
        run: |
          set -eu
          rm -f libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a
          make -C libstratosphere clean || true
          make -C libstratosphere nx_release
          test -s libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Apply ZT stubs-only patch
        run: |
          set -eu
          python3 scripts/patch-ldn-zt.py
          ! grep -R -- '-lzt' ldn_mitm/ldn_mitm/Makefile
          grep -q 'zt_stubs.cpp' ldn_mitm/ldn_mitm/Makefile
          test ! -f ldn_mitm/ldn_mitm/source/zt_bridge.cpp
          test ! -f ldn_mitm/ldn_mitm/source/errno_compat.c
          test ! -f third_party/libzt/lib/libzt.a

      - name: Build patched vanilla-with-stubs ldn_mitm.nsp
        working-directory: ldn_mitm/ldn_mitm
        run: |
          set -eu
          make clean || true
          make -j2
          test -s ldn_mitm.nsp
          ls -lh ldn_mitm.nsp

      - name: Package stubs-first control
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/atmosphere/contents/4200000000000010/flags
          cp ldn_mitm/ldn_mitm/ldn_mitm.nsp dist/atmosphere/contents/4200000000000010/exefs.nsp
          cp ldn_mitm/ldn_mitm/res/toolbox.json dist/atmosphere/contents/4200000000000010/toolbox.json
          touch dist/atmosphere/contents/4200000000000010/flags/boot2.flag

          test -s dist/atmosphere/contents/4200000000000010/exefs.nsp
          test -s dist/atmosphere/contents/4200000000000010/toolbox.json
          test -f dist/atmosphere/contents/4200000000000010/flags/boot2.flag

          cd dist
          zip -r ../ldn-zt-stubs-control.zip atmosphere

      - name: Upload stubs-first control
        uses: actions/upload-artifact@v4
        with:
          name: ldn-zt-stubs-control
          path: ldn-zt-stubs-control.zip
          retention-days: 14
