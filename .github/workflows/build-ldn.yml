name: Build LDN Sysmodule (stubs)

on:
  push:
    branches: [main]
    paths:
      - 'ldn_mitm/**'
      - 'scripts/zt_bridge.hpp'
      - 'scripts/zt_stubs.cpp'
      - 'scripts/anchor_check_defender.py'
      - '.github/workflows/build-ldn.yml'
  pull_request:
    paths:
      - 'ldn_mitm/**'
      - 'scripts/zt_bridge.hpp'
      - 'scripts/zt_stubs.cpp'
      - 'scripts/anchor_check_defender.py'
      - '.github/workflows/build-ldn.yml'
  workflow_dispatch:

jobs:
  build-ldn-stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout pinned Defender and Atmosphere
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pins
        run: |
          set -eu
          test "$(git -C ldn_mitm rev-parse HEAD)" = "2fe07817eeea06b712009395f8bbcb2a02d30979"
          test "$(sed -n 's/^[[:space:]]*commit = //p' ldn_mitm/Atmosphere-libs/.gitrepo)" = "d3083af1827cd6ca2a96feb9316eb85cd01bae1f"
          python3 scripts/anchor_check_defender.py

      - name: Build Atmosphere libraries
        working-directory: ldn_mitm/Atmosphere-libs
        run: |
          set -eu
          make -C libstratosphere nx_release
          test -s libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Apply boot-safe ZT stubs
        run: |
          set -eu
          cp scripts/zt_bridge.hpp ldn_mitm/ldn_mitm/source/zt_bridge.hpp
          cp scripts/zt_stubs.cpp ldn_mitm/ldn_mitm/source/zt_stubs.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ldn_mitm/ldn_mitm/source/ldn_icommunication.cpp')
          s = p.read_text()
          s = s.replace('#include <arpa/inet.h>\n', '#include <arpa/inet.h>\n#include "zt_bridge.hpp"\n', 1)
          anchor = '        R_TRY(lanDiscovery.initialize([&](){'
          replacement = '        R_TRY(ztbridge::init());\n\n' + anchor
          if anchor not in s:
              raise SystemExit('LDN Initialize anchor missing')
          p.write_text(s.replace(anchor, replacement, 1))
          PY
          test -f ldn_mitm/ldn_mitm/source/zt_stubs.cpp
          ! test -f ldn_mitm/ldn_mitm/source/zt_bridge.cpp
          ! grep -q -- '-lzt' ldn_mitm/ldn_mitm/Makefile

      - name: Build boot-safe LDN sysmodule
        working-directory: ldn_mitm/ldn_mitm
        run: |
          set -eu
          make clean || true
          make -j2
          test -s ldn_mitm.nsp

      - name: Package Sys A
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/atmosphere/contents/4200000000000010/flags
          cp ldn_mitm/ldn_mitm/ldn_mitm.nsp dist/atmosphere/contents/4200000000000010/exefs.nsp
          cp ldn_mitm/ldn_mitm/res/toolbox.json dist/atmosphere/contents/4200000000000010/toolbox.json
          touch dist/atmosphere/contents/4200000000000010/flags/boot2.flag
          test -s dist/atmosphere/contents/4200000000000010/exefs.nsp
          test -f dist/atmosphere/contents/4200000000000010/flags/boot2.flag
          cd dist
          zip -r ../ldn-stubs.zip atmosphere

      - name: Upload Sys A artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldn-stubs
          path: ldn-stubs.zip
          retention-days: 14
