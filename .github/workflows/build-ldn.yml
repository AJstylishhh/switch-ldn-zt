name: Build LDN sysmodule

on:
  push:
    branches: [main]
    paths:
      - 'ldn_mitm/**'
      - 'scripts/patch-ldn-zt.py'
      - 'scripts/zt_bridge.*'
      - 'scripts/zt_stubs.cpp'
      - '.gitmodules'
      - '.github/workflows/build-ldn.yml'
  workflow_dispatch:

jobs:
  build-ldn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select known-good ldn_mitm nightly base
        run: |
          set -eu
          git -C ldn_mitm fetch --no-tags origin 9a2639eff5b2e60065be3dfae69c46de6c3d7648
          git -C ldn_mitm checkout --detach 9a2639eff5b2e60065be3dfae69c46de6c3d7648
          git -C ldn_mitm submodule sync --recursive
          git -C ldn_mitm submodule update --init --recursive

      - name: Verify pinned sources
        run: |
          set -eu
          actual="$(git -C ldn_mitm rev-parse HEAD)"
          echo "ldn_mitm: $actual"
          test "$actual" = "9a2639eff5b2e60065be3dfae69c46de6c3d7648"
          actual="$(git -C ldn_mitm/Atmosphere-libs rev-parse HEAD)"
          echo "Atmosphere-libs: $actual"
          test "$actual" = "82f1553c4c7e68364f7e630b1c68f2aee8681dee"
          actual="$(git -C libzt rev-parse HEAD)"
          echo "libzt: $actual"
          test "$actual" = "76c138bb916bc3a20d356bd4ef8e2195212ddb1e"
          test -f ldn_mitm/ldn_mitm/Makefile
          test -f ldn_mitm/Atmosphere-libs/config/templates/stratosphere.mk
          test -f ldn_mitm/Atmosphere-libs/libstratosphere/Makefile
          test -f scripts/patch-ldn-zt.py
          test -f scripts/zt_bridge.hpp
          test -f scripts/zt_stubs.cpp

      - name: Patch LDN socket transport to ZeroTier
        run: |
          set -eu
          python3 scripts/patch-ldn-zt.py
          test -f ldn_mitm/ldn_mitm/source/zt_stubs.cpp
          test -f ldn_mitm/ldn_mitm/source/zt_bridge.hpp
          grep -q 'ztbridge::poll' ldn_mitm/ldn_mitm/source/lan_protocol.cpp
          grep -q 'ztbridge::connect' ldn_mitm/ldn_mitm/source/lan_discovery.cpp
          grep -q 'ztbridge::init' ldn_mitm/ldn_mitm/source/ldn_icommunication.cpp
          ! grep -q -- '-lzt' ldn_mitm/ldn_mitm/Makefile

      - name: Restore Atmosphere library cache
        id: atmosphere-cache
        uses: actions/cache/restore@v4
        with:
          path: ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a
          key: atmosphere-libstratosphere-8e9c9ab-devkita64

      - name: Build Atmosphere libraries
        if: steps.atmosphere-cache.outputs.cache-hit != 'true'
        working-directory: ldn_mitm/Atmosphere-libs
        run: |
          set -eu
          make -C libstratosphere nx_release
          test -s libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Verify Atmosphere library
        run: |
          set -eu
          test -s ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a
          ls -lh ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Save Atmosphere library cache
        if: always() && steps.atmosphere-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a
          key: atmosphere-libstratosphere-8e9c9ab-devkita64

      - name: Build LDN ZeroTier sysmodule
        working-directory: ldn_mitm/ldn_mitm
        run: |
          set -eu
          make clean || true
          make -j2
          test -s ldn_mitm.nsp
          ls -lh ldn_mitm.nsp

      - name: Package sysmodule and config template
        run: |
          set -eu
          mkdir -p dist/atmosphere/contents/4200000000000010/flags
          mkdir -p dist/config/switch-ldn-zt
          cp ldn_mitm/ldn_mitm/ldn_mitm.nsp dist/atmosphere/contents/4200000000000010/exefs.nsp
          : > dist/atmosphere/contents/4200000000000010/flags/boot2.flag
          cp ldn_mitm/ldn_mitm/res/toolbox.json dist/atmosphere/contents/4200000000000010/toolbox.json
          printf 'YOUR_ZEROTIER_NETWORK_ID\n' > dist/config/switch-ldn-zt/network_id.txt
          printf 'PEER_SWITCH_ZEROTIER_IP\n' > dist/config/switch-ldn-zt/peer_ip.txt
          test -s dist/atmosphere/contents/4200000000000010/exefs.nsp
          test -f dist/atmosphere/contents/4200000000000010/flags/boot2.flag
          test -s dist/atmosphere/contents/4200000000000010/toolbox.json
          cd dist
          zip -r ../ldn-zt-sysmodule.zip atmosphere config

      - name: Upload LDN ZeroTier sysmodule
        uses: actions/upload-artifact@v4
        with:
          name: ldn-zt-sysmodule
          path: ldn-zt-sysmodule.zip
          retention-days: 14
