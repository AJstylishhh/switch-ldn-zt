name: Build vanilla LDN control

on:
  push:
    branches: [main]
    paths:
      - 'ldn_mitm/**'
      - '.gitmodules'
      - '.github/workflows/build-ldn.yml'
  workflow_dispatch:

jobs:
  build-vanilla-ldn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout exact Defender base
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact source pins
        run: |
          set -eu
          actual="$(git -C ldn_mitm rev-parse HEAD)"
          echo "ldn_mitm: $actual"
          test "$actual" = "2fe07817eeea06b712009395f8bbcb2a02d30979"

          atmosphere_commit="$(sed -n 's/^[[:space:]]*commit = //p' ldn_mitm/Atmosphere-libs/.gitrepo)"
          echo "Atmosphere-libs subrepo commit: $atmosphere_commit"
          test "$atmosphere_commit" = "d3083af1827cd6ca2a96feb9316eb85cd01bae1f"

          test -f ldn_mitm/ldn_mitm/Makefile
          test -f ldn_mitm/Atmosphere-libs/config/templates/stratosphere.mk
          test -f ldn_mitm/Atmosphere-libs/libstratosphere/Makefile

      - name: Force clean Atmosphere library rebuild
        working-directory: ldn_mitm/Atmosphere-libs
        run: |
          set -eu
          rm -f libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a
          make -C libstratosphere clean || true
          make -C libstratosphere nx_release
          test -s libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a

      - name: Save d3083af Atmosphere library cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ldn_mitm/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a
          key: atmosphere-libstratosphere-d3083af-devkita64

      - name: Build vanilla ldn_mitm.nsp
        working-directory: ldn_mitm/ldn_mitm
        run: |
          set -eu
          make clean || true
          make -j2
          test -s ldn_mitm.nsp
          ls -lh ldn_mitm.nsp

      - name: Package exact vanilla control layout
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/atmosphere/contents/4200000000000010/flags
          cp ldn_mitm/ldn_mitm/ldn_mitm.nsp dist/atmosphere/contents/4200000000000010/exefs.nsp
          cp ldn_mitm/ldn_mitm/res/toolbox.json dist/atmosphere/contents/4200000000000010/toolbox.json
          touch dist/atmosphere/contents/4200000000000010/flags/boot2.flag

          test -s dist/atmosphere/contents/4200000000000010/exefs.nsp
          test -s dist/atmosphere/contents/4200000000000010/toolbox.json
          test -f dist/atmosphere/contents/4200000000000010/flags/boot2.flag

          cd dist
          zip -r ../ldn-vanilla-control.zip atmosphere

      - name: Upload vanilla control
        uses: actions/upload-artifact@v4
        with:
          name: ldn-vanilla-control
          path: ldn-vanilla-control.zip
          retention-days: 14
